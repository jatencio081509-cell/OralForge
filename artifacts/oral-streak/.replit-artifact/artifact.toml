kind = "mobile"
previewPath = "/"
title = "OralStreak"
version = "1.0.0"
id = "artifacts/oral-streak"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25513

[services.development]
run = "pnpm --filter @workspace/oral-streak run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/oral-streak", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/oral-streak", "run", "serve" ]

[services.env]
PORT = "25513"
BASE_PATH = "/"
